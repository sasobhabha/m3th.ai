[project]
name = "m3th"
version = "0.2.0"
description = "AMC 10-style problem generator and quiz — from-scratch char-GPT CLI plus a LoRA-fine-tuned Qwen web app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "numpy>=2.5.3",
    "peft>=0.20.0",
    "torch>=2.14.0",
    "transformers>=5.16.1",
]

[project.optional-dependencies]
web = ["flask>=3.1.3"]

[project.scripts]
m3th = "m3th.__main__:main"

[tool.setuptools]
packages = ["m3th"]

[tool.setuptools.package-data]
m3th = ["data/*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
